[workspace]
name = "tandem-jax"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.14.*"
jax = ">=0.10"
jaxlib = { version = ">=0.10", build = "cpu*" }
pytest = "*"
pip = "*"

[pypi-dependencies]
tandem-jax = { path = ".", editable = true }

[tasks]
test = "pytest"
bench = "python tools/bench.py"
