name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install . pytest
      - run: pytest
  vectors:
    name: vectors are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git clone --depth 1 https://github.com/tandem-rng/spec ../spec
      - run: diff ../spec/vectors.json tests/vectors.json
