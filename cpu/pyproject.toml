[build-system]
requires = ["scikit-build-core>=0.10", "jaxlib>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "tandem-jax-cpu"
version = "0.1.0"
description = "The tandem-c fills as an XLA FFI handler, for tandem-jax on CPUs"
license = "Apache-2.0"
authors = [{name = "Jessica Cox"}]
requires-python = ">=3.11"
dependencies = ["jax>=0.10"]

[tool.scikit-build]
wheel.packages = ["src/tandem_jax_cpu"]
